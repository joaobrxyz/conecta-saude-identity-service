version: '3.8'

services:
  db-identity:
    image: postgres:15-alpine
    container_name: identity_postgres_v2
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db_identity
    ports:
      - "5433:5432"
    volumes:
      - identity_pg_data_v2:/var/lib/postgresql/data

volumes:
  identity_pg_data_v2: